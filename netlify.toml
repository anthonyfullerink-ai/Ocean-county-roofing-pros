[build]
  command = "pip install -r requirements.txt && python build_static.py"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# Inbound Web Form Handler
[[redirects]]
  from = "/api/leads/webform"
  to = "/.netlify/functions/api-webform"
  status = 200

# Live Calendar Availability & Instant Booking
[[redirects]]
  from = "/api/calendar/*"
  to = "/.netlify/functions/api-calendar"
  status = 200

# Vapi 2-Way Sync
[[redirects]]
  from = "/api/vapi/sync/*"
  to = "/.netlify/functions/api-admin"
  status = 200

# Vapi Voice AI Tool Calling
[[redirects]]
  from = "/api/vapi/tools"
  to = "/.netlify/functions/api-vapi-tools"
  status = 200

# Vapi End of Call & Webhook
[[redirects]]
  from = "/api/vapi/*"
  to = "/.netlify/functions/api-vapi-webhook"
  status = 200

# Feedback / Resolution Hub
[[redirects]]
  from = "/api/feedback/*"
  to = "/.netlify/functions/api-feedback"
  status = 200

# Admin & Tenant Management API
[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/api-admin"
  status = 200

# First-Party Website Analytics Collector & Dashboard Summary
[[redirects]]
  from = "/api/analytics/*"
  to = "/.netlify/functions/api-analytics"
  status = 200

# Contractor Partner Portal API
[[redirects]]
  from = "/api/portal/*"
  to = "/.netlify/functions/api-admin"
  status = 200

# Resend Inbound Email Webhook & AI Agent
[[redirects]]
  from = "/api/email/*"
  to = "/.netlify/functions/api-email-inbound"
  status = 200

# Twilio Inbound SMS Webhook (+18669001221)
[[redirects]]
  from = "/api/twilio/sms-inbound"
  to = "/.netlify/functions/api-twilio-sms"
  status = 200

# Twilio 800/866 Voice Forwarding to Local Vapi AI Number
[[redirects]]
  from = "/api/twilio/*"
  to = "/.netlify/functions/api-twilio-voice"
  status = 200

# Direct Static CDN Assets
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200
